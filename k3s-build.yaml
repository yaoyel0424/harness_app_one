apiVersion: v1
data:
  contact-points.yaml: "apiVersion: 1\r\n\r\n# Contact Point 璺敱锛歕r\n# - MyAppErrorLogSpike锛圠oki锛夆啋
    oncall-relay 鈫?log-alert 鑷姩淇\r\n# - MyAppPromtailLogNotify锛圥romtail 閲囬泦娴侊級鈫?log-notify-only
    鈫?閭欢/椋炰功锛堥渶閰嶇疆 SMTP 鎴栨敼 Webhook锛塡r\ncontactPoints:\r\n  - orgId: 1\r\n    name: oncall-relay\r\n
    \   receivers:\r\n      - uid: oncall_relay_webhook\r\n        type: webhook\r\n
    \       settings:\r\n          url: http://oncall-relay:8787/webhook\r\n          httpMethod:
    POST\r\n        disableResolveMessage: false\r\n\r\n  - orgId: 1\r\n    name:
    log-notify-only\r\n    receivers:\r\n      - uid: log_notify_email\r\n        type:
    email\r\n        settings:\r\n          addresses: ops@example.com\r\n          singleEmail:
    false\r\n        disableResolveMessage: false\r\n\r\npolicies:\r\n  - orgId: 1\r\n
    \   receiver: log-notify-only\r\n    group_by:\r\n      - alertname\r\n    group_wait:
    30s\r\n    group_interval: 5m\r\n    repeat_interval: 4h\r\n    routes:\r\n      -
    receiver: oncall-relay\r\n        matchers:\r\n          - alertname = MyAppErrorLogSpike\r\n
    \     - receiver: log-notify-only\r\n        matchers:\r\n          - alertname
    = MyAppPromtailLogNotify\r\n"
  rules.yaml: "apiVersion: 1\r\n\r\n# Grafana Loki 鍛婅锛堟棩蹇楃粡 Promtail 鈫?Loki锛塡r\n# -
    MyAppErrorLogSpike锛歀oki 璇勪及 鈫?oncall-relay 鈫?log-alert 鑷姩淇\r\n# - MyAppPromtailLogNotify锛歅romtail
    閲囬泦娴?鈫?浠呴€氱煡锛堥偖浠剁瓑锛夛紝涓?auto-fix\r\ngroups:\r\n  - orgId: 1\r\n    name: myapp-log-alerts\r\n
    \   folder: Oncall\r\n    interval: 1m\r\n    rules:\r\n      - uid: myapp_error_log_spike\r\n
    \       title: MyAppErrorLogSpike\r\n        condition: C\r\n        data:\r\n
    \         - refId: A\r\n            relativeTimeRange:\r\n              from:
    300\r\n              to: 0\r\n            datasourceUid: loki\r\n            model:\r\n
    \             editorMode: code\r\n              expr: 'sum(count_over_time({job=\"myapp\",
    ingest=\"promtail\"} | json | level=\"ERROR\" [5m]))'\r\n              queryType:
    instant\r\n              refId: A\r\n          - refId: B\r\n            relativeTimeRange:\r\n
    \             from: 0\r\n              to: 0\r\n            datasourceUid: __expr__\r\n
    \           model:\r\n              conditions:\r\n                - evaluator:\r\n
    \                   params: []\r\n                    type: gt\r\n                  operator:\r\n
    \                   type: and\r\n                  query:\r\n                    params:
    [A]\r\n                  reducer:\r\n                    params: []\r\n                    type:
    last\r\n                  type: query\r\n              datasource:\r\n                type:
    __expr__\r\n                uid: __expr__\r\n              expression: A\r\n              reducer:
    last\r\n              refId: B\r\n              type: reduce\r\n          - refId:
    C\r\n            relativeTimeRange:\r\n              from: 0\r\n              to:
    0\r\n            datasourceUid: __expr__\r\n            model:\r\n              conditions:\r\n
    \               - evaluator:\r\n                    params: [3]\r\n                    type:
    gt\r\n                  operator:\r\n                    type: and\r\n                  query:\r\n
    \                   params: [C]\r\n                  reducer:\r\n                    params:
    []\r\n                    type: last\r\n                  type: query\r\n              expression:
    B\r\n              refId: C\r\n              type: threshold\r\n        noDataState:
    OK\r\n        execErrState: Alerting\r\n        for: 5m\r\n        annotations:\r\n
    \         summary: myapp ERROR 鏃ュ織婵€澧烇紙5 鍒嗛挓鍐?>3 鏉★級\r\n          description: Loki
    鍛婅 鈫?oncall-relay 鈫?log-alert 鑷姩淇銆俓r\n        labels:\r\n          severity:
    critical\r\n          oncall_action: auto-fix\r\n          alert_channel: loki\r\n
    \       isPaused: false\r\n\r\n      - uid: myapp_promtail_log_notify\r\n        title:
    MyAppPromtailLogNotify\r\n        condition: C\r\n        data:\r\n          -
    refId: A\r\n            relativeTimeRange:\r\n              from: 300\r\n              to:
    0\r\n            datasourceUid: loki\r\n            model:\r\n              editorMode:
    code\r\n              expr: 'sum(count_over_time({job=\"myapp\", ingest=\"promtail\"}
    | json | level=\"ERROR\" [5m]))'\r\n              queryType: instant\r\n              refId:
    A\r\n          - refId: B\r\n            relativeTimeRange:\r\n              from:
    0\r\n              to: 0\r\n            datasourceUid: __expr__\r\n            model:\r\n
    \             conditions:\r\n                - evaluator:\r\n                    params:
    []\r\n                    type: gt\r\n                  operator:\r\n                    type:
    and\r\n                  query:\r\n                    params: [A]\r\n                  reducer:\r\n
    \                   params: []\r\n                    type: last\r\n                  type:
    query\r\n              datasource:\r\n                type: __expr__\r\n                uid:
    __expr__\r\n              expression: A\r\n              reducer: last\r\n              refId:
    B\r\n              type: reduce\r\n          - refId: C\r\n            relativeTimeRange:\r\n
    \             from: 0\r\n              to: 0\r\n            datasourceUid: __expr__\r\n
    \           model:\r\n              conditions:\r\n                - evaluator:\r\n
    \                   params: [0]\r\n                    type: gt\r\n                  operator:\r\n
    \                   type: and\r\n                  query:\r\n                    params:
    [C]\r\n                  reducer:\r\n                    params: []\r\n                    type:
    last\r\n                  type: query\r\n              expression: B\r\n              refId:
    C\r\n              type: threshold\r\n        noDataState: OK\r\n        execErrState:
    Alerting\r\n        for: 2m\r\n        annotations:\r\n          summary: Promtail
    閲囬泦鍒?ERROR 鏃ュ織锛? 鍒嗛挓鍐?鈮? 鏉★級\r\n          description: 浠呴€氱煡杩愮淮锛堥偖浠?椋炰功绛夛級锛屼笉瑙﹀彂 auto-fix銆俓r\n
    \       labels:\r\n          severity: warning\r\n          notify_only: \"true\"\r\n
    \         alert_channel: promtail\r\n        isPaused: false\r\n"
