apiVersion: v1
data:
  alertmanager.yml: "global:\r\n  resolve_timeout: 5m\r\n\r\nroute:\r\n  group_by:
    [\"alertname\", \"service\"]\r\n  group_wait: 30s\r\n  group_interval: 5m\r\n
    \ repeat_interval: 4h\r\n  receiver: oncall-relay\r\n  routes:\r\n    - matchers:\r\n
    \       - oncall_action = auto-fix\r\n      receiver: oncall-relay\r\n      continue:
    true\r\n    - matchers:\r\n        - oncall_action = scale-advisory\r\n      receiver:
    oncall-relay\r\n\r\nreceivers:\r\n  - name: oncall-relay\r\n    webhook_configs:\r\n
    \     - url: http://oncall-relay.observability.svc.cluster.local:8787/webhook\r\n
    \       send_resolved: true\r\n\r\ninhibit_rules:\r\n  - source_matchers:\r\n
    \     - alertname = MyAppDown\r\n    target_matchers:\r\n      - alertname = MyAppHighErrorRate\r\n
    \   equal: [\"service\"]\r\n"
